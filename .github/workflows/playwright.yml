name: Playwright Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  # Run once a week (Sunday 00:00 UTC). Adjust cron as needed (UTC timezone).
  schedule:
    - cron: '0 0 * * 0'
  # Allow manual runs from the Actions UI
  workflow_dispatch: {}

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    env:
      SAUCE_DEMO_STANDARD_USER: ${{ secrets.SAUCE_DEMO_STANDARD_USER }}
      SAUCE_DEMO_PASS: ${{ secrets.SAUCE_DEMO_PASS }}

    # Use official Playwright container for consistent browser versions
    container:
      image: mcr.microsoft.com/playwright:v1.42.0-focal
      options: --user 1001

    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        # Run the browser installer without system dependency installation so it doesn't require root in the container
        run: npx playwright install

      - name: Run Playwright tests
        run: npx playwright test

      - name: Set up Java (required by Allure)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "Found allure-results, generating report..."
            npx -p allure-commandline@2.x allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results found — skipping Allure report generation"
          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14
        continue-on-error: true

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14
        continue-on-error: true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Add artifact links to job summary
        if: always()
        run: |
          echo "## 📦 CI Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Open the GitHub Actions run page](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download the uploaded artifacts from that run page: Allure report, Allure raw results, and Playwright HTML report." >> "$GITHUB_STEP_SUMMARY"