name: Playwright Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  # Run once a week (Sunday 00:00 UTC). Adjust cron as needed (UTC timezone).
  schedule:
    - cron: '0 0 * * 0'
  # Allow manual runs from the Actions UI
  workflow_dispatch: {}

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    env:
      SAUCE_DEMO_STANDARD_USER: ${{ secrets.SAUCE_DEMO_STANDARD_USER }}
      SAUCE_DEMO_PASS: ${{ secrets.SAUCE_DEMO_PASS }}

    # Use official Playwright container for consistent browser versions
    container:
      image: mcr.microsoft.com/playwright:v1.42.0-focal
      options: --user 1001

    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        # Run the browser installer without system dependency installation so it doesn't require root in the container
        run: npx playwright install

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14